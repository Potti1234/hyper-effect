name: Release

# On main: with pending changesets, opens or updates the "Version Packages"
# pull request; once that is merged, publishes the new versions to npm and
# creates the GitHub releases. See docs/releasing.md.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # npm authenticates with trusted publishing (OIDC, id-token above);
          # no npm token is stored.
          NPM_CONFIG_PROVENANCE: true
      # A push made with GITHUB_TOKEN starts no workflows, so CI is started
      # on the Version Packages branch by hand.
      - if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main
