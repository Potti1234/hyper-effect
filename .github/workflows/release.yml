name: Release

# On main: with pending changesets, opens or updates the "Version Packages"
# pull request; once that is merged, publishes the new versions to npm and
# creates the GitHub releases. See docs/releasing.md.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version: npm run version-packages
          publish: npm run release
          title: Version Packages
          commit: Version Packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only for the first publish, before trusted publishing is set up
          # on npmjs.com; remove the secret afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
