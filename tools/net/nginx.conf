# nginx in front of a hyper-effect app on the host (experiment 4).
# :8080 plain HTTP/1.1, :8443 TLS with HTTP/2 (self-signed, see nginx.sh).
# A typical reverse-proxy configuration: response buffering is left at its
# default (on), as most deployments do; the app must cope with that.
events {}
http {
  upstream app {
    server host.docker.internal:3000;
    keepalive 32;
  }
  map $http_upgrade $connection_upgrade { default ""; }
  server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    client_max_body_size 12m;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
    }
  }
}
